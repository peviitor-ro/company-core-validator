name: Company Core Validator — 20 firme/run

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Câte firme neprocesate să valideze'
        required: true
        default: '20'
        type: string
  schedule:
    - cron: '0 4 * * *'   # zilnic 04:00 UTC

concurrency:
  group: company-core-validator
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      LIMIT: ${{ inputs.limit || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore validator state
        uses: actions/cache@v4
        with:
          path: |
            cache/results.json
            cache/companies.json
            cache/documents.json
            cache/providers.json
            cache/urls.json
          key: company-core-validator-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: company-core-validator-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install -g opencode-ai

      - name: Write opencode config
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle"
          }
          EOF

      - name: List brand-check targets
        run: |
          set -euo pipefail
          python scripts/brand_targets.py --limit "${LIMIT}" > cache/brand-targets.json
          echo "Brand checks required for $(python -c 'import json;print(len(json.load(open("cache/brand-targets.json"))))') companies"

      - name: Collect web evidence for brands
        run: python scripts/brand_verify.py

      - name: Verify brands and APPLY fixes with OpenCode
        run: |
          set -euo pipefail

          cat > /tmp/validator-prompt.txt <<PROMPT
          You are running in GitHub Actions inside the peviitor-ro/company-core-validator
          repository. Read AGENTS.md and README.md before doing anything.

          THIS RUN MUST WRITE FIXES TO THE API. There is no dry-run mode and you must
          not invent any flag that suppresses writes.

          BRAND VERIFICATION IS MANDATORY AND COMES FIRST:
          - cache/brand-targets.json is the deterministic list of this batch.
          - cache/brand-checks.json already contains the web evidence collected in
            parallel by scripts/brand_verify.py: official website title/snippet,
            CUIFirma name, and a "review" flag. Read it.
          - Review EVERY row with "review": true. Use webfetch on the source URL for
            each of those companies and confirm whether the brand belongs to that
            legal entity. Print one line per reviewed company:
            CUI | live brand | source URL | verdict (ok / corrected).
          - If the live brand clearly belongs to a DIFFERENT company, add ONLY that
            correction to cache/brand-overrides.json BEFORE running the CLI.
          - Do not add speculative overrides. A different legal suffix or a missing
            brand token on a homepage is NOT proof. If all checked brands check out,
            leave the file untouched.
          - If no web evidence at all could be collected, STOP now, do not run the CLI,
            and state explicitly that brand verification failed. Never apply fixes
            without it.

          THEN APPLY:
          - Run exactly this command:
            python -m company_core_validator.cli run --unprocessed --limit ${LIMIT} --workers 8
          - The CLI always applies changes. Never add --dry-run, --apply or any other
            write-suppressing flag; those options do not exist.
          - Never manually override company, status, location, website, career,
            scraperFile or lastScraped. The validator and providers own those fields.
          - If the command fails, report the error and keep cache/results.json intact.

          AFTER THE RUN:
          - Read cache/report.json and print scannedThisRun and summary.
          - Print a short markdown table with the CUI, company name and changed fields
            for the companies scanned in THIS run only.
          - Read back 2-3 applied companies from https://api.peviitor.ro/v1/firme/company/
            to confirm the fixes landed (allow a short delay for eventual consistency).
          PROMPT

          opencode run "$(cat /tmp/validator-prompt.txt)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_number }}
          path: |
            cache/report.json
            cache/brand-overrides.json
          if-no-files-found: warn

      - name: Print summary
        if: always()
        run: |
          if [ -f cache/report.json ]; then
            python - <<'PY'
          import json
          report = json.load(open("cache/report.json", encoding="utf-8"))
          print("scannedThisRun:", report.get("scannedThisRun"))
          print("summary:", json.dumps(report.get("summary"), ensure_ascii=False))
          PY
          fi
